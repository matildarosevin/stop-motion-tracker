<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes glitch-shift {
        0% { transform: translate(0, 0); }
        20% { transform: translate(-2px, 2px); }
        40% { transform: translate(2px, -2px); }
        60% { transform: translate(-1px, -1px); }
        80% { transform: translate(1px, 1px); }
        100% { transform: translate(0, 0); }
      }
      
      .glitch-base {
        animation: glitch-shift 2s infinite;
      }
      
      .glitch-layer-1 {
        animation: glitch-shift 2.3s infinite;
        opacity: 0.8;
      }
      
      .glitch-layer-2 {
        animation: glitch-shift 2.7s infinite;
        opacity: 0.6;
      }
    </style>
  </defs>
  
  <!-- Black background -->
  <rect width="100" height="100" fill="#000"/>
  
  <!-- Main bright pink element -->
  <g class="glitch-base">
    <!-- Center square  -->
    <rect x="30" y="30" width="40" height="40" fill="none" stroke="#ff4081" stroke-width="3" rx="2"/>
    
    <!-- Film holes on sides -->
    <circle cx="30" cy="25" r="2.5" fill="#ff4081"/>
    <circle cx="70" cy="25" r="2.5" fill="#ff4081"/>
    <circle cx="30" cy="75" r="2.5" fill="#ff4081"/>
    <circle cx="70" cy="75" r="2.5" fill="#ff4081"/>
  </g>
  
  <!-- Glitch layer 1  hot pink -->
  <g class="glitch-layer-1">
    <rect x="30" y="30" width="40" height="40" fill="none" stroke="#ff1493" stroke-width="3" rx="2"/>
    <circle cx="30" cy="25" r="2.5" fill="#ff1493"/>
    <circle cx="70" cy="25" r="2.5" fill="#ff1493"/>
  </g>
  
  <!-- Glitch layer 2 (blue) -->
  <g class="glitch-layer-2">
    <rect x="30" y="30" width="40" height="40" fill="none" stroke="#3b82f6" stroke-width="2" rx="2"/>
    <circle cx="30" cy="75" r="2.5" fill="#3b82f6"/>
    <circle cx="70" cy="75" r="2.5" fill="#ff4081"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="#ff4081"/>
</svg>
